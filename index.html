<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>García - Tu Barrio</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2e7d32">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- HEADER -->
    <header class="header">
        <div class="header-top">
            <div class="logo">
                <h1>🛒 García</h1>
                <span class="subtitle">Tu Barrio</span>
            </div>
            <div class="header-actions">
                <button id="themeToggle" class="theme-btn" aria-label="Cambiar tema">🌙</button>
                <button id="searchToggle" class="search-btn" aria-label="Buscar">🔍</button>
                <a href="carrito.html" class="cart-btn" aria-label="Carrito">
                    🛒
                    <span id="cartCount" class="cart-badge">0</span>
                </a>
            </div>
        </div>
        <div id="searchBar" class="search-bar hidden">
            <input type="text" id="searchInput" placeholder="Buscar productos..." autocomplete="off">
            <button id="searchClear" class="clear-btn">✕</button>
        </div>
    </header>

    <!-- CATEGORÍAS -->
    <nav class="categories-nav">
        <ul id="categoriesList">
            <li><button class="category-btn active" data-categoria="todos">Todos</button></li>
        </ul>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="main-content">
        <div id="productGrid" class="product-grid">
            <!-- Los productos se renderizan aquí -->
        </div>
        
        <!-- Skeleton loading -->
        <div id="skeletonLoader" class="skeleton-grid">
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="footer-content">
            <p class="store-name">🏪 García - Tu Barrio</p>
            <p class="store-address">📍 Calzada y García, Cárdenas</p>
            <p class="store-hours">🕐 Lun-Sáb 8:00am - 6:00pm</p>
            <p class="store-phone">📞 <a href="tel:+5352715892">+53 52715892</a></p>
            <p class="store-whatsapp">💬 <a href="https://wa.me/5352715892" target="_blank">WhatsApp</a></p>
        </div>
        <div class="footer-bottom">
            <p>© 2026 García - Tu Barrio</p>
        </div>
    </footer>

    <!-- NOTIFICACIÓN -->
    <div id="notification" class="notification hidden">
        <span id="notificationMessage">Producto añadido</span>
    </div>

    <script src="js/db.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
